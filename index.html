  <style>

he 3s ease-in-out infinite;filter:drop-shadow(0 12px 3px #456c2b16)}.tiger-button:hover .tiger{filter:drop-shadow(0 12px 3px #456c2b25)}.sleeping .tiger{animation:breathe 5s ease-in-out infinite}.sleeping .eye-open{display:none}.eye-sleep{display:none}.sleeping .eye-sleep{display:block}.happy .tiger{animation:hop .42s ease-in-out 2}.nameplate{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-weight:800;font-size:18px}.nameplate small{display:block;font-size:11px;font-weight:400;color:#71815b;margin-top:5px}.float{position:absolute;left:50%;top:45%;font-size:32px;pointer-events:none;animation:float 1.3s ease-out forwards}.side h2{font-size:17px;margin:0 0 6px}.level{display:flex;justify-content:space-between;align-items:center}.level span{font-size:12px;color:#73816c}.progress{height:6px;background:#e0e7d9;border-radius:3px;overflow:hidden;margin:12px 0 27px}.progress div{height:100%;background:#71a477;width:0;transition:width .4s}.stat{margin:18px 0}.stat-label{display:flex;align-items:center;justify-content:space-between;font-size:13px}.stat-label span{display:flex;align-items:center;gap:8px}.stat-label svg{width:16px;height:16px}.bar{height:8px;border-radius:4px;background:#e7eadf;overflow:hidden;margin-top:10px}.bar div{height:100%;transition:width .4s;border-radius:4px}.divider{height:1px;background:#dde5d8;margin:26px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.action{border:1px solid #d9e3d3;background:#fffef8;padding:13px 8px;border-radius:6px;font-size:13px;display:flex;gap:8px;justify-content:center;align-items:center;transition:background .2s,transform .2s}.action:hover{background:#e7efdf;transform:translateY(-2px)}.action svg{width:17px;height:17px}.action.primary{background:#335c43;color:#fff;border-color:#335c43}.quote{margin-top:20px;font-size:12px;line-height:1.9;color:#7c8975}.lower{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}.section-title{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 15px}.section-title svg{width:17px}.foods{display:flex;gap:10px}.food{flex:1;min-width:0;border:1px solid #dfe5d8;background:#fffef8;border-radius:8px;padding:14px 6px}.food:hover{border-color:#84a877;background:#eff4e8}.food .emoji{display:block;font-size:29px;margin-bottom:5px}.food b{font-size:12px;display:block}.food small{font-size:10px;color:#89937e}.memories{margin:0;padding:0;list-style:none;font-size:12px;color:#6b7f6f}.memories li{padding:8px 0;border-bottom:1px solid #e3e8dd;display:flex;gap:12px}.memories time{color:#99a18f;font-size:10px;white-space:nowrap}footer{padding:24px 0 0;margin-top:24px;border-top:1px solid #dfe6d8;display:flex;justify-content:space-between;color:#8b9783;font-size:11px}dialog{border:1px solid #d0ddc9;border-radius:8px;padding:24px;max-width:480px;width:calc(100% - 32px);background:#f7faef;color:#284431}dialog::backdrop{background:#15342180}dialog h2{margin:0;font-size:22px}.modal-top{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;padding:8px;display:flex}.close svg{width:20px;height:20px}.game-info{display:flex;justify-content:space-between;margin:14px 0;font-size:13px}.field{position:relative;height:300px;background:#dfedd4;border-radius:6px;overflow:hidden;touch-action:none}.basket{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font-size:40px;width:66px;text-align:center}.drop{position:absolute;font-size:30px;width:36px;text-align:center}.game-start{width:100%;margin-top:14px}.modal-copy{font-size:13px;margin:18px 0}.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.badge{text-align:center;padding:18px 4px;background:#e6eedc;border-radius:6px;font-size:12px}.badge span{font-size:30px;display:block;margin-bottom:8px}.badge.locked{filter:grayscale(1);opacity:.45}@keyframes breathe{50%{transform:translateY(-5px) rotate(1deg)}}@keyframes hop{50%{transform:translateY(-22px) rotate(-5deg)}}@keyframes float{to{transform:translateY(-130px) rotate(20deg);opacity:0}}@media(max-width:760px){header{padding:20px}.date{display:none}main{padding:10px 20px 24px}h1{font-size:26px}.intro{display:block}.pill{margin-top:12px}.layout{grid-template-columns:1fr;gap:24px}.habitat{min-height:440px}.side{padding:0 2px}.side .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{margin:0}.stat-label{font-size:11px}.stat-label span{gap:4px}.progress{margin-bottom:18px}.divider{margin:20px 0}.actions{grid-template-columns:repeat(4,1fr);gap:7px}.action{flex-direction:column;font-size:11px;padding:12px 3px}.quote{display:none}.lower{grid-template-columns:1fr;gap:24px}.food{padding:12px 5px}footer{font-size:10px}.tiger-button{bottom:68px;width:230px;height:250px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body>
<header><div class="brand"><i data-lucide="paw-print"></i> 虎子的小小领地</div><div class="date" id="date"></div></header>
<main>
  <div class="intro"><div><h1>虎子，今天也要虎虎生风。</h1><p>森林里有个小家伙，一直在等你。</p></div><span class="pill">今日份的可爱，已上线</span></div>
  <div class="layout">
    <section class="habitat" id="habitat" aria-label="小老虎的森林">
      <svg class="scene" viewBox="0 0 760 490" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><rect width="760" height="490" fill="#e4efdb"/><circle cx="607" cy="90" r="39" fill="#f5e8a4"/><path d="M0 235Q90 120 220 230Q360 115 520 237Q670 125 760 215V490H0" fill="#d1e3c0"/><path d="M0 300Q180 205 350 296Q540 210 760 290V490H0" fill="#bdd4a5"/><path d="M0 370Q240 315 450 359Q650 316 760 348V490H0" fill="#a9c68f"/><ellipse cx="390" cy="439" rx="225" ry="57" fill="#c3d59b"/><g fill="#71955e"><path d="M53 390l-14-38 24 28 6-48 10 45 28-17-19 31z"/><path d="M651 416l-10-30 19 18 8-41 7 39 24-16-14 31z"/></g><g fill="#f9f3ce"><circle cx="130" cy="403" r="5"/><circle cx="621" cy="364" r="4"/><circle cx="586" cy="441" r="5"/></g><g fill="#7c9b60"><ellipse cx="96" cy="431" rx="11" ry="4"/><ellipse cx="602" cy="396" rx="13" ry="4"/></g></svg>
      <span class="scene-label"><i data-lucide="map-pin" style="width:14px;height:14px"></i> 森林 · 秘密基地</span><span class="weather"><i data-lucide="sun"></i></span>
      <div class="bubble" id="speech" role="status" aria-live="polite">你来啦！我有一点点想你。真的，就一点点。</div>
      <button class="tiger-button" id="tiger" aria-label="摸摸小老虎的头" title="摸摸头">
        <svg class="tiger" viewBox="0 0 260 280" role="img" aria-label="圆滚滚的动漫小老虎">
          <g stroke="#513a2d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M191 220Q254 239 236 183Q230 169 218 180" fill="none" stroke="#de923b" stroke-width="19"/><path d="M239 214l-12-3m13-16-13 2" fill="none"/>
          <ellipse cx="133" cy="217" rx="65" ry="53" fill="#f4b653"/><ellipse cx="132" cy="225" rx="39" ry="39" fill="#fff1cf" stroke="none"/><path d="M77 214l18 9-16 7m110-16-17 9 16 7" fill="#70452e" stroke="none"/><ellipse cx="92" cy="260" rx="28" ry="13" fill="#f4b653"/><ellipse cx="173" cy="260" rx="28" ry="13" fill="#f4b653"/>
          <circle cx="59" cy="73" r="29" fill="#f4b653"/><circle cx="59" cy="73" r="16" fill="#d98c65" stroke="none"/><circle cx="203" cy="73" r="29" fill="#f4b653"/><circle cx="203" cy="73" r="16" fill="#d98c65" stroke="none"/>
          <path d="M43 118Q43 54 130 49Q219 53 219 120Q234 181 180 195Q129 217 77 194Q26 178 43 118Z" fill="#f5b64f"/>
          <path d="M119 51l4 28 10 6 9-7 3-27M105 86h54M132 81v23M114 101h37" fill="none" stroke-width="7"/>
          <path d="M43 112l29 12-30 8m0 12 27 7-21 10m170-49-28 12 29 8m0 12-26 7 20 10" fill="#70452e" stroke="none"/>
          <path d="M76 151Q102 129 130 150Q156 129 183 151Q195 185 162 193H100Q66 187 76 151" fill="#fff1cf" stroke="none"/>
          <g class="eye-open"><ellipse cx="93" cy="129" rx="6" ry="10" fill="#3c332c" stroke="none"/><ellipse cx="170" cy="129" rx="6" ry="10" fill="#3c332c" stroke="none"/><circle cx="95" cy="126" r="2" fill="white" stroke="none"/><circle cx="172" cy="126" r="2" fill="white" stroke="none"/></g><g class="eye-sleep" fill="none"><path d="M85 131q8-8 16 0m61 0q8-8 16 0"/></g>
          <ellipse cx="76" cy="148" rx="12" ry="6" fill="#ed9970" stroke="none"/><ellipse cx="187" cy="148" rx="12" ry="6" fill="#ed9970" stroke="none"/><path d="M121 153q10-5 20 0l-10 10z" fill="#714334"/><path d="M131 163v9m-13-2q4 12 13 2 10 10 15-2" fill="none" stroke-width="3"/><path d="M72 166l-22-2m23 10-19 5m135-13 23-2m-24 10 20 5" stroke-width="2"/>
          <path d="M92 253v9m8-9v9m66-9v9m9-9v9" stroke-width="2"/></g>
        </svg>
      </button>
      <div class="nameplate">小虎 <span style="font-size:12px;color:#70815d">HU ZI</span><small id="mood">一只正在认真等饭的小老虎</small></div>
    </section>
    <aside class="side">
      <div class="level"><h2 id="level">Lv.1 初见小虎</h2><span id="xp">0 / 50</span></div><div class="progress"><div id="xpbar"></div></div>
      <div class="stats"><div class="stat"><div class="stat-label"><span><i data-lucide="utensils" style="color:#cb8d47"></i>饱食度</span><b id="hungerValue"></b></div><div class="bar"><div id="hungerBar" style="background:#d8a158"></div></div></div>
      <div class="stat"><div class="stat-label"><span><i data-lucide="heart" style="color:#d18887"></i>开心值</span><b id="joyValue"></b></div><div class="bar"><div id="joyBar" style="background:#d48e8c"></div></div></div>
      <div class="stat"><div class="stat-label"><span><i data-lucide="zap" style="color:#6e9c7a"></i>精力值</span><b id="energyValue"></b></div><div class="bar"><div id="energyBar" style="background:#7aa080"></div></div></div></div>
      <div class="divider"></div><h2>陪小虎待一会儿</h2>
      <div class="actions"><button class="action primary" id="pet"><i data-lucide="hand"></i>摸摸头</button><button class="action" id="play"><i data-lucide="gamepad-2"></i>接接好吃的</button><button class="action" id="sleep"><i data-lucide="moon"></i><span>睡个懒觉</span></button><button class="action" id="album"><i data-lucide="award"></i>成长徽章</button></div>
      <div class="quote">“别看我个头小，<br>保护虎子这件事，我可是认真的。”</div>
    </aside>
  </div>
  <div class="lower"><section><h2 class="section-title"><i data-lucide="salad"></i>今天给小虎加点餐</h2><div class="foods"><button class="food" data-food="meat"><span class="emoji">🥩</span><b>香香肉排</b><small>饱食 +18</small></button><button class="food" data-food="fish"><span class="emoji">🐟</span><b>鲜鲜小鱼</b><small>饱食 +12 · 开心 +8</small></button><button class="food" data-food="apple"><span class="emoji">🍎</span><b>脆脆苹果</b><small>饱食 +8 · 精力 +8</small></button><button class="food" data-food="ice"><span class="emoji">🍦</span><b>快乐甜筒</b><small>开心 +18</small></button></div></section><section><h2 class="section-title"><i data-lucide="notebook-pen"></i>我们的小日常</h2><ul class="memories" id="memories"></ul></section></div>
  <footer><span>给虎子的专属快乐补给站</span><span>小虎在，快乐就在。</span></footer>
</main>
<dialog id="gameModal"><div class="modal-top"><h2>小虎的加餐时间</h2><button class="close" data-close title="关闭"><i data-lucide="x"></i></button></div><p class="modal-copy" id="gameMessage">接住从天而降的美味，躲开石头！</p><div class="game-info"><span id="score">美味 0 份</span><span id="timer">20 秒</span></div><div class="field" id="field" aria-label="接食物游戏区域" tabindex="0"><div class="basket" id="basket">🧺</div></div><button class="action primary game-start" id="startGame">开始加餐</button></dialog>
<dialog id="albumModal"><div class="modal-top"><h2>小虎的成长徽章</h2><button class="close" data-close title="关闭"><i data-lucide="x"></i></button></div><div class="album-grid" id="badges"></div><p class="modal-copy" id="totals"></p></dialog>
<script>
  'use strict';
  const $=id=>document.getElementById(id), clamp=n=>Math.max(0,Math.min(100,n));
  const defaults={hunger:65,joy:75,energy:80,xp:0,feeds:0,pets:0,games:0,best:0,logs:[]};
  let state={...defaults},sleeping=false,busy=false,game=null,saveOK=true;
  try{const saved=JSON.parse(localStorage.getItem('huzi-forest-v1'));if(saved&&typeof saved==='object'){for(const key of Object.keys(defaults)){if(key!=='logs'&&Number.isFinite(saved[key])&&saved[key]>=0)state[key]=saved[key];}if(Array.isArray(saved.logs))state.logs=saved.logs.filter(x=>x&&typeof x.text==='string'&&typeof x.time==='string').slice(0,3);}}catch(e){saveOK=false;}
  for(const k of ['hunger','joy','energy'])state[k]=clamp(state[k]);
  function save(){try{localStorage.setItem('huzi-forest-v1',JSON.stringify(state));}catch(e){saveOK=false;}}
  function render(){for(const key of ['hunger','joy','energy']){$(key+'Value').textContent=Math.round(state[key]);$(key+'Bar').style.width=state[key]+'%';}const lv=Math.floor(state.xp/50)+1;$('level').textContent='Lv.'+lv+' '+(['初见小虎','森林搭子','默契伙伴','虎子守护者'][Math.min(3,lv-1)]);$('xp').textContent=(state.xp%50)+' / 50';$('xpbar').style.width=(state.xp%50)*2+'%';$('memories').replaceChildren();state.logs.forEach(log=>{const li=document.createElement('li'),time=document.createElement('time'),txt=document.createElement('span');time.textContent=log.time;txt.textContent=log.text;li.append(time,txt);$('memories').append(li);});$('habitat').classList.toggle('sleeping',sleeping);$('sleep').querySelector('span').textContent=sleeping?'叫醒小虎':'睡个懒觉';$('mood').textContent=sleeping?'梦里也在和虎子一起探险':state.hunger<25?'肚子咕咕叫，想吃点好吃的':state.energy<25?'今天的电量有点不够用了':'一只被虎子宠爱的小老虎';save();}
  function log(text){state.logs.unshift({time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),text});state.logs=state.logs.slice(0,3);}
  function say(text){$('speech').textContent=text;}
  function effect(emoji){const el=document.createElement('span');el.className='float';el.textContent=emoji;el.style.marginLeft=(Math.random()*100-50)+'px';$('habitat').append(el);setTimeout(()=>el.remove(),1400);}
  function celebrate(){if(window.confetti&&!matchMedia('(prefers-reduced-motion: reduce)').matches)window.confetti({particleCount:55,spread:60,origin:{y:.6},colors:['#79a879','#edbc61','#e59991']});}
  function gain(n){const before=Math.floor(state.xp/50);state.xp+=n;if(Math.floor(state.xp/50)>before){celebrate();log('升级啦！和虎子又亲近了一点。');}}
  function awake(){if(sleeping){say('呼噜呼噜……先让我睡一小会儿。');return false;}if(game){say('加餐比赛还在进行中哦！');return false;}return true;}
  function pet(){if(!awake()||busy)return;busy=true;state.pets++;state.joy=clamp(state.joy+9);gain(5);say(['摸了我的头，就要对我的可爱负责哦。','呼噜～虎子的手，有魔法！','谁是森林里最棒的人？当然是虎子。','再摸一下嘛，我又不会告诉别人。'][Math.floor(Math.random()*4)]);effect('💕');$('habitat').classList.add('happy');log('虎子摸了摸小虎，收获一阵呼噜声。');render();setTimeout(()=>{busy=false;$('habitat').classList.remove('happy');},900);}
  $('pet').onclick=pet;$('tiger').onclick=pet;
  const foods={meat:{emoji:'🥩',hunger:18,joy:3,energy:0,text:'肉肉一入口，烦恼全溜走！'},fish:{emoji:'🐟',hunger:12,joy:8,energy:0,text:'这条鱼好鲜！虎子真会挑。'},apple:{emoji:'🍎',hunger:8,joy:2,energy:8,text:'咔嚓！我也是讲究营养的小老虎。'},ice:{emoji:'🍦',hunger:0,joy:18,energy:0,text:'甜筒是夏天，虎子是全世界。'}};
  document.querySelectorAll('[data-food]').forEach(button=>button.onclick=()=>{if(!awake()||busy)return;const f=foods[button.dataset.food];if(f.hunger&&state.hunger>92){say('肚皮已经圆滚滚啦！陪我玩一会儿吧。');return;}busy=true;for(const k of ['hunger','joy','energy'])state[k]=clamp(state[k]+f[k]);state.feeds++;gain(8);say(f.text);effect(f.emoji);log('虎子投喂了'+button.querySelector('b').textContent+'。');render();setTimeout(()=>busy=false,650);});
  $('sleep').onclick=()=>{if(game)return;sleeping=!sleeping;say(sleeping?'Zzz……梦里有虎子，还有吃不完的肉。':'睡饱啦！又是元气满满的小老虎！');log(sleeping?'小虎抱着软软的梦睡着了。':'小虎伸了个大懒腰。');render();};
  setInterval(()=>{if(sleeping){state.energy=clamp(state.energy+3);state.joy=clamp(state.joy+1);if(state.energy===100){sleeping=false;say('睡饱啦，虎子！今天去哪里冒险？');}}else{state.hunger=clamp(state.hunger-1);state.energy=clamp(state.energy-.5);}render();},10000);
  $('date').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
  $('album').onclick=()=>{const items=[['🥩','干饭搭子',state.feeds>=1],['💕','摸头大师',state.pets>=10],['🧺','加餐高手',state.best>=10],['🌱','森林伙伴',state.xp>=100],['🏅','形影不离',state.xp>=250],['👑','虎子最棒',state.games>=5]];$('badges').replaceChildren();items.forEach(([emoji,name,unlocked])=>{const el=document.createElement('div');el.className='badge'+(unlocked?'':' locked');const icon=document.createElement('span');icon.textContent=emoji;el.append(icon,document.createTextNode(name));el.title=unlocked?'已获得':({'摸头大师':'摸头 10 次','加餐高手':'单局接住 10 份','森林伙伴':'累计 100 经验','形影不离':'累计 250 经验','虎子最棒':'完成 5 局游戏'}[name]||'投喂 1 次');$('badges').append(el);});$('totals').textContent=`一起吃过 ${state.feeds} 次加餐，摸过 ${state.pets} 次头，玩过 ${state.games} 场游戏。`+(saveOK?'':' 当前浏览器无法保存记录。');$('albumModal').showModal();};
  const field=$('field');let basketX=.5;
  function moveBasket(x){basketX=Math.max(.08,Math.min(.92,x));$('basket').style.left=(basketX*100)+'%';}
  field.addEventListener('pointermove',e=>{if(game){const r=field.getBoundingClientRect();moveBasket((e.clientX-r.left)/r.width);}});
  field.addEventListener('pointerdown',e=>{field.setPointerCapture(e.pointerId);const r=field.getBoundingClientRect();moveBasket((e.clientX-r.left)/r.width);});
  field.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();moveBasket(basketX+(e.key==='ArrowLeft'?-.07:.07));}});
  $('play').onclick=()=>{if(!awake())return;if(state.energy<10){say('眼皮在打架啦，先睡个觉再玩吧。');return;}$('gameModal').showModal();};
  function finish(completed){if(!game)return;cancelAnimationFrame(game.frame);const score=game.score;game.items.forEach(i=>i.el.remove());game=null;$('startGame').disabled=false;$('startGame').textContent='再玩一次';if(completed){state.games++;state.best=Math.max(state.best,score);state.joy=clamp(state.joy+score*2);state.hunger=clamp(state.hunger+score);state.energy=clamp(state.energy-10);gain(Math.min(30,score*3));log('和虎子接到了 '+score+' 份美味！');$('gameMessage').textContent='接到 '+score+' 份！'+(score>=10?'虎子，你是我的加餐之神！':'这份快乐，小虎已经打包收藏。');say('今天的美味，是和虎子一起接住的！');if(score>=10)celebrate();render();}else{$('gameMessage').textContent='小虎等你回来继续加餐。';}}
  $('gameModal').addEventListener('close',()=>finish(false));
  $('startGame').onclick=()=>{if(game)return;$('startGame').disabled=true;$('gameMessage').textContent='好吃的都到篮子里来！';moveBasket(.5);field.focus();const now=performance.now();game={start:now,last:now,spawn:0,score:0,items:[],frame:0};function tick(t){if(!game)return;const dt=Math.min(.05,(t-game.last)/1000);game.last=t;const remaining=Math.max(0,20-(t-game.start)/1000);$('timer').textContent=Math.ceil(remaining)+' 秒';if(!remaining){finish(true);return;}if(t-game.spawn>650){game.spawn=t;const el=document.createElement('span'),rock=Math.random()<.2;el.className='drop';el.textContent=rock?'🪨':['🥩','🍎','🐟'][Math.floor(Math.random()*3)];field.append(el);game.items.push({el,rock,x:.08+Math.random()*.84,y:-35});}const w=field.clientWidth,h=field.clientHeight;for(let i=game.items.length-1;i>=0;i--){const item=game.items[i];item.y+=dt*145;item.el.style.left=(item.x*w-18)+'px';item.el.style.top=item.y+'px';const caught=item.y>=h-65&&item.y<h-20&&Math.abs((item.x-basketX)*w)<40;if(caught||item.y>h){if(caught){game.score=Math.max(0,game.score+(item.rock?-2:1));$('score').textContent='美味 '+game.score+' 份';}item.el.remove();game.items.splice(i,1);}}game.frame=requestAnimationFrame(tick);}$('score').textContent='美味 0 份';game.frame=requestAnimationFrame(tick);};
  if(!state.logs.length)log('小虎搬进了森林，给虎子留了个位置。');render();
  window.addEventListener('DOMContentLoaded',()=>{if(window.lucide)window.lucide.createIcons();});
  console.assert(clamp(-1)===0&&clamp(101)===100&&clamp(42)===42,'状态范围校验失败');
</script>
